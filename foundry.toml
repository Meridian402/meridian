# Foundry config for the Solidity in contracts/. The repo is TypeScript-first —
# these are the only on-chain pieces we author ourselves — so src points at
# contracts/ rather than the default src/, which holds the agent backend.
[profile.default]
src = "contracts"
out = "contracts/out"
libs = ["lib"]
solc = "0.8.26"  # v4-core requires >=0.8.26; ^0.8.24 in our own files is satisfied by it
optimizer = true
optimizer_runs = 200
# launch() genuinely needs this: it carries the token, both sorted addresses,
# the pool, the locker, both amounts and the tick bounds at once, which is past
# the EVM's 16-slot reach. The alternative is splitting the function purely to
# please the stack, which would scatter one atomic sequence across helpers and
# make it harder to audit — the opposite of what this contract needs.
via_ir = true
# Cancun, not London. Uniswap v4 does its flash accounting in TRANSIENT storage
# (EIP-1153), so TSTORE/TLOAD must exist or the PoolManager's own code cannot
# execute — forking against it on london reverts every call with no useful
# error. Robinhood Chain is an Arbitrum Orbit L2 running an ArbOS that supports
# it, which is why v4 is deployed there at all.
evm_version = "cancun"
